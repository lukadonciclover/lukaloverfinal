[project]
name = "equitylens-api"
version = "1.0.0"
description = "Deterministic financial modeling and equity valuation API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.117,<1",
    "uvicorn>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "PyMuPDF>=1.23,<2",
    "pydantic>=2.6,<3",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.28,<1",
    "formulas>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
